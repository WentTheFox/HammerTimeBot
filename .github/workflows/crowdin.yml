name: Crowdin Sync

on:
  push:
    branches: [ main ]
    paths:
      # Only source (English) string changes actually need a Crowdin re-sync - a push that
      # doesn't touch these was spamming a new "New Crowdin translations" commit/PR-notify on
      # every deploy-related push, since i18n_main gets rebased onto main's new tip regardless
      # of whether anything translatable actually changed.
      - 'src/locales/en-US/**'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  synchronize-with-crowdin:
    name: Synchronize with Crowdin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: crowdin/github-action@0d5670f539973aea2f01abce61a8989934df0025 # v3.0.2
        with:
          upload_sources: true
          download_translations: true
          localization_branch_name: i18n_main
          crowdin_branch_name: main
          create_pull_request: true
          pull_request_title: New Crowdin updates
          pull_request_base_branch_name: main
          commit_message: New Crowdin translations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
