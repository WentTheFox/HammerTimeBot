name: Publish container image

# Publishes ghcr.io/wentthefox/hammertimebot (linux/amd64 + linux/arm64) on every push to main, like Fantastick.
# Every push gets sha-<7 hex> and sha-<40 hex>. There are no version tags, no `latest` and no `v*` git tags: the commit is
# the version. (`mcp-v*` git tags belong to the MCP registry release, see publish-mcp.yml.)
# Nothing secret is in the image (see .dockerignore).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  commitlint:
    name: 'Lint commit messages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  publish:
    name: 'Publish to GHCR'
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every push to main is published as sha-<7 hex> (and the full sha-<40 hex>).
      - name: Compute image tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "TAGS<<EOF"
            echo "${image}:sha-${GITHUB_SHA:0:7}"
            echo "${image}:sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One multi-platform build: the tags are manifest lists, pushed only once both architectures are built.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
