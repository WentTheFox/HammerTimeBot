name: Publish container image

# Publishes ghcr.io/wentthefox/hammertimebot (linux/amd64 + linux/arm64) on every push to main, like Fantastick.
# The version comes from the Conventional Commits since the last `v*` tag (feat = minor, fix and the other recognized
# types = patch, `!` / BREAKING CHANGE = major); a push with nothing to release publishes nothing. The tag is created only
# after the image was pushed. (`mcp-v*` tags belong to the MCP registry release and are ignored here.)
# Tags: X.Y.Z, X.Y and sha-<short commit>. There is no `latest`. Nothing secret is in the image (see .dockerignore).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  commitlint:
    name: 'Lint commit messages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  publish:
    name: 'Version and publish to GHCR'
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dry_run: the next version without pushing the tag yet, so a failed build leaves no tag without an image.
      - name: Compute next version from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          dry_run: true

      - name: Set lowercase image name
        if: steps.tag.outputs.new_tag
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.tag.outputs.new_tag
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tag.outputs.new_tag

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.tag.outputs.new_tag
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.tag.outputs.new_tag
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.new_version }}
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.new_major }}.${{ steps.tag.outputs.new_minor }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release
        if: steps.tag.outputs.new_tag
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}
