# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`, with cwd set to this
# worktree. See that repo's template/deploy.conf.example for the full contract
# ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on a non-bare
# `production` remote with receive.denyCurrentBranch=updateInstead) - same steps, same
# lockfile-diff-gated pnpm install. No graceful-respawn dance here (unlike the toolkit's
# discord.js-ShardingManager example) - this app dropped its gateway/shard process entirely in
# favor of a single stateless webhook.js process (see README.md's "Webhook deployment" section),
# so a plain `pm2 restart` on every deploy is already cheap and always safe.

deploy_build() {
  local changed_files=""
  if [[ "$oldrev" != "0000000000000000000000000000000000000000" ]]; then
    changed_files=$(git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev")
  fi

  if [[ -z "$changed_files" ]] || grep -q "^pnpm-lock\.yaml" <<< "$changed_files"; then
    pnpm install --frozen-lockfile
  else
    echo "git-deploy: skipping pnpm install, lockfile not modified"
  fi

  npm run build

  # Command sync (registering slash/context-menu commands with Discord) is best-effort and
  # decoupled from the actual process restart below - a transient Discord API failure here
  # (hit in practice: a timed-out global command reload) must not abort the deploy and skip
  # deploy_restart, which is what happened the first time this ran: the shared hook's
  # inherited `set -euo pipefail` aborted deploy_build at this line, and the process kept
  # running stale code even though the worktree itself had already been updated. The old
  # setup/post-receive.sh this replaced never had this problem since it was a plain `sh`
  # script with no `set -e`.
  if ! npm run sync-commands; then
    echo "git-deploy: sync-commands failed, continuing anyway (best-effort, see deploy.conf)" >&2
  fi
}

deploy_restart() {
  pm2 restart pm2.json
}
