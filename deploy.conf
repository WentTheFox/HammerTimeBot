# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`, with cwd set to this
# worktree. See that repo's template/deploy.conf.example for the full contract
# ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on a non-bare
# `production` remote with receive.denyCurrentBranch=updateInstead) - same steps, same
# manifest-hash-gated pnpm install. No graceful-respawn dance here (unlike the toolkit's
# discord.js-ShardingManager example) - this app dropped its gateway/shard process entirely in
# favor of a single stateless webhook.js process (see README.md's "Webhook deployment" section),
# so a plain `pm2 restart` on every deploy is already cheap and always safe.

# Skips `pnpm install` unless the dependency manifests differ from the ones the installed
# node_modules was last built from. This is a recorded hash rather than a diff between the
# previous and the new push: a diff goes stale after a failed install (the next push then
# compares against a revision that never got installed and wrongly skips it - hit when the
# workspace layout changed and pnpm aborted). The marker lives inside node_modules, so a purged
# or fresh node_modules always installs. CI=true keeps pnpm from asking for confirmation (it
# aborts without a TTY when it needs to rebuild node_modules, e.g. after a workspace change).
install_dependencies() {
  local marker="node_modules/.git-deploy-install-hash"
  local current_hash
  current_hash=$(cat pnpm-lock.yaml pnpm-workspace.yaml package.json packages/*/package.json | sha256sum | cut -d' ' -f1)

  if [[ -f "$marker" && "$(cat "$marker")" == "$current_hash" ]]; then
    echo "git-deploy: skipping pnpm install, dependency manifests unchanged since the last install"
    return 0
  fi

  # Explicit returns: `set -e` is suppressed when the caller runs this in a condition, and the
  # marker must only ever record an install that actually succeeded.
  CI=true pnpm install --frozen-lockfile || return 1
  printf '%s' "$current_hash" > "$marker"
}

deploy_build() {
  install_dependencies || return 1

  npm run build

  # Command sync (registering slash/context-menu commands with Discord, syncing FAQ/timezone data)
  # takes 15-30s+ hitting several external APIs, and is best-effort/decoupled from the actual
  # process restart below - a transient failure here (hit in practice: a timed-out global command
  # reload, and separately a backend 500) must not abort the deploy and skip deploy_restart, which
  # is what happened the first time this ran: the shared hook's inherited `set -euo pipefail`
  # aborted deploy_build at this line, and the process kept running stale code even though the
  # worktree itself had already been updated. The old setup/post-receive.sh this replaced never had
  # this problem since it was a plain `sh` script with no `set -e`.
  #
  # Run detached (setsid, stdio redirected to a log file, disowned) rather than inline: this whole
  # hook runs synchronously inside the `git push`'s SSH session, so an inline sync-commands is still
  # tied to that session's pipe - a client-side disconnect/timeout/Ctrl-C partway through (this step
  # is the slowest part of the deploy) SIGHUPs the foreground hook process and everything under it,
  # killing sync-commands mid-request. Even a plain `&` without setsid/redirected stdio would still
  # die on SIGPIPE the moment the SSH channel closes, since it'd inherit that pipe as its stdout.
  # Detaching it here means the deploy (and `git push`) completes as soon as the build/restart are
  # done, and sync-commands finishes independently regardless of what the push's connection does
  # afterwards - check sync-commands.log for its result.
  setsid nohup npm run sync-commands >> "$WORKTREE/sync-commands.log" 2>&1 < /dev/null &
  disown
}

# The environment file of the API server, relative to the worktree. It is ignored by git, so it only lives on the server.
API_ENV_FILE="packages/api/.env"

# The file used to be .env.api in the root of the worktree. Moves it once, so the deploy that switches pm2.json to the new
# path does not leave the API server without its configuration. Does nothing when there is nothing to move, or when the new
# file is already there (then the old one is left alone for someone to look at).
migrate_legacy_api_env() {
  local legacy="$WORKTREE/.env.api" current="$WORKTREE/$API_ENV_FILE"
  if [[ -f "$legacy" && ! -e "$current" ]]; then
    echo "git-deploy: moving .env.api to $API_ENV_FILE"
    mv "$legacy" "$current"
  fi
}

# What pm2 has of the app: "absent", "single" (not a cluster), "down" (a worker that is not online, such as one that keeps crashing)
# or "cluster" (all of it running as a cluster).
pm2_app_state() {
  pm2 jlist 2> /dev/null | node -e '
    let out = "";
    process.stdin.on("data", chunk => out += chunk).on("end", () => {
      // pm2 can print warnings before the JSON, and they start with a [ too ("[PM2][WARN] ..."), so the JSON is the first
      // part from a [ that parses
      let apps = [];
      for (let from = out.indexOf("["); from !== -1 && !apps.length; from = out.indexOf("[", from + 1)) {
        try {
          apps = JSON.parse(out.slice(from));
        } catch {
          // Not the JSON
        }
      }
      const workers = apps.filter(entry => entry.name === process.argv[1]);
      if (workers.length === 0) console.log("absent");
      else if (workers.some(entry => entry.pm2_env.exec_mode !== "cluster_mode")) console.log("single");
      else if (workers.some(entry => entry.pm2_env.status !== "online")) console.log("down");
      else console.log("cluster");
    });
  ' "$1"
}

# Starts an app of pm2.json, or replaces its workers when it is running: `reload` restarts a cluster one worker at a time and
# (wait_ready in pm2.json) stops the old worker only once the new one is listening, so a deploy drops nothing.
#
# pm2 only reads the exec mode and the log paths when a process STARTS, so one that still runs as a single process, or still logs
# elsewhere (into the shared ~/.pm2/logs), is deleted and started fresh once, right here. That one deploy has a short gap, after it
# a reload is enough. So is one that is down: there is nothing to replace, and a reload of workers that never become ready waits
# for them (it held a deploy up, and every deploy after it, for good). Every pm2 call has a time limit for that reason as well, a
# deploy that fails says why, one that hangs says nothing. $2 is the path of the out log the app is supposed to have.
PM2_DEPLOY_TIMEOUT="${PM2_DEPLOY_TIMEOUT:-180}"
deploy_pm2_app() {
  local name="$1" out_log="$2" reason=""
  case "$(pm2_app_state "$name")" in
    absent) ;;
    single) reason="it does not run as a cluster yet" ;;
    down) reason="it is not running" ;;
    *)
      # Compared as a substring of `pm2 jlist` (a pipe into grep -q would trip pipefail via SIGPIPE)
      if [[ "$(pm2 jlist 2> /dev/null)" != *"\"pm_out_log_path\":\"$out_log\""* ]]; then
        reason="its pm2 logs are not in the worktree"
      fi
      ;;
  esac
  if [[ -n "$reason" ]]; then
    echo "git-deploy: $name: $reason (one-time delete + start)"
    timeout "$PM2_DEPLOY_TIMEOUT" pm2 delete "$name" || return 1
  fi
  # Starts it when it is not there, reloads it when it is
  if ! timeout "$PM2_DEPLOY_TIMEOUT" pm2 startOrReload pm2.json --only "$name"; then
    echo "git-deploy: $name did not start or reload within ${PM2_DEPLOY_TIMEOUT}s (or failed), see pm2 logs $name"
    return 1
  fi
  pm2 save
}

deploy_restart() {
  # The processes log into this worktree's logs/ (see pm2.json; rotated by deploy.logrotate).
  mkdir -p "$WORKTREE/logs"
  deploy_pm2_app "HammerTimeBot:Webhook" "$WORKTREE/logs/pm2-webhook-out.log"

  # The API server (packages/api) is opt-in: it only runs where packages/api/.env exists, since it cannot start without it.
  # It reads that file instead of the bot's .env on purpose, so it never sees the bot's secrets.
  migrate_legacy_api_env
  if [[ -f "$WORKTREE/$API_ENV_FILE" ]]; then
    deploy_pm2_app "HammerTimeBot:Api" "$WORKTREE/logs/pm2-api-out.log"
  else
    echo "git-deploy: no $API_ENV_FILE, not starting the API server (see packages/api/README.md)"
  fi
}
