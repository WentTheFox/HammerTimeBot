# Reverse proxy for the webhook (HTTP Interactions Endpoint) entrypoint, src/webhook.ts - the
# webhook-mode counterpart to the gateway-based bot process, which needs no nginx entry of its own
# since it never accepts inbound connections. Deployed on hammertime.vps at
# /etc/nginx/sites-available/bot.hammertime.cyou.conf (symlinked into sites-enabled), following the
# same layout as SledgeHammerTime's nginx configs on that host. See README.md's "Webhook deployment"
# section for the one-time server setup this depends on (cert --expand, port allocation, PM2 entry).
#
# Deliberately much smaller than the SledgeHammerTime/Laravel configs this is modeled after: this is
# a pure JSON API (Discord POSTs interactions, nothing else touches this host/port), so there's no
# static file serving, PHP-FPM, gzip, or asset caching to configure - just TLS termination + a
# reverse proxy to the Node process listening on WEBHOOK_PORT (env.ts, defaults to 3939).

server {
    listen 443 ssl;
    http2 on;
    server_name bot.hammertime.cyou;
    access_log /var/log/nginx/bot.hammertime.cyou-access.log;
    error_log /var/log/nginx/bot.hammertime.cyou-error.log;

    include snippets/cf-resolve-ips.conf;
    include snippets/ssl-params.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "sameorigin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3939;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/beta.hammertime.cyou/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beta.hammertime.cyou/privkey.pem; # managed by Certbot
}

server {
    if ($host = bot.hammertime.cyou) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bot.hammertime.cyou;
    return 404; # managed by Certbot
}
