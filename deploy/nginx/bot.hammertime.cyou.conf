# Reverse proxy for the webhook (HTTP Interactions Endpoint) entrypoint, src/webhook.ts - the
# webhook-mode counterpart to the gateway-based bot process, which needs no nginx entry of its own
# since it never accepts inbound connections. Deployed on hammertime.vps at
# /etc/nginx/sites-available/bot.hammertime.cyou.conf (symlinked into sites-enabled), following the
# same layout as SledgeHammerTime's nginx configs on that host. See README.md's "Webhook deployment"
# section for the one-time server setup this depends on (cert --expand, port allocation, PM2 entry).
#
# Deliberately much smaller than the SledgeHammerTime/Laravel configs this is modeled after: this is
# a pure JSON API (Discord POSTs interactions, nothing else touches this host/port), so there's no
# static file serving, PHP-FPM, gzip, or asset caching to configure - just TLS termination + a
# reverse proxy to the Node process listening on WEBHOOK_PORT (env.ts, defaults to 3939).

# Timing-oriented access log, for telling apart where a slow interaction delivery spent its time
# (see describeSlowWebhookDelivery): $request_time is from nginx reading the request's first byte to
# logging it, $upstream_* are the Node process's share of that, $connection_requests > 1 means
# Cloudflare reused an existing connection to this origin, and CF-Ray's suffix is the Cloudflare
# data center that received the request from Discord. Defined here rather than in nginx.conf since
# this file is included at the http level, where log_format has to live.
log_format hammertime_webhook '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
    'conn=$connection reqs=$connection_requests cf_ray=$http_cf_ray "$http_user_agent"';

server {
    listen 443 ssl;
    http2 on;
    server_name bot.hammertime.cyou;
    access_log /var/log/nginx/bot.hammertime.cyou-access.log hammertime_webhook;
    error_log /var/log/nginx/bot.hammertime.cyou-error.log;

    include snippets/cf-resolve-ips.conf;
    include snippets/ssl-params.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "sameorigin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3939;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry if the backend is flat-out unreachable (connection refused/reset, or nginx gets no
        # response within the timeout below) - covers the brief window during a deploy's
        # `pm2 restart` where the old process has exited and the new one hasn't bound WEBHOOK_PORT
        # yet. Deliberately NOT retrying on an actual HTTP 5xx from the app (the default
        # proxy_next_upstream also includes those) - by then it may already be mid-interaction, and
        # replaying the request could double-handle it. proxy_connect_timeout is trimmed way down
        # from nginx's 60s default, and the retry budget kept small, so a failed attempt is retried
        # fast enough to still have a shot at Discord's 3-second interaction-response deadline.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 2s;
    }

    ssl_certificate /etc/letsencrypt/live/beta.hammertime.cyou/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beta.hammertime.cyou/privkey.pem; # managed by Certbot
}

server {
    if ($host = bot.hammertime.cyou) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bot.hammertime.cyou;
    return 404; # managed by Certbot
}
