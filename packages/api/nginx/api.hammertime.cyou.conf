# Reverse proxy for the HammerTime API (packages/api), for hammertime.vps at
# /etc/nginx/sites-available/api.hammertime.cyou.conf (symlinked into sites-enabled), modeled on the bot's
# webhook vhost. The API only listens on 127.0.0.1:3010 (HOST in .env.api), so this is the only way in.
#
# One-time setup:
#   1. DNS: an api.hammertime.cyou record in Cloudflare, proxied like the others.
#   2. TLS: add the name to the certificate this file uses, e.g.
#        certbot certonly --expand --cert-name beta.hammertime.cyou -d <every name it has now> -d api.hammertime.cyou
#   3. mkdir -p /var/node/HammerTimeBot/logs/nginx (it exists already for the webhook vhost)
#   4. ln -s ../sites-available/api.hammertime.cyou.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# proxy_set_header X-Real-IP below is what CLIENT_IP_HEADER=X-Real-IP in .env.api trusts, which is only sound because
# nginx overwrites it with the client address that snippets/cf-resolve-ips.conf worked out (Cloudflare's CF-Connecting-IP).

server {
    listen 443 ssl;
    http2 on;
    server_name api.hammertime.cyou;
    access_log /var/node/HammerTimeBot/logs/nginx/api-access.log;
    error_log /var/node/HammerTimeBot/logs/nginx/api-error.log;

    include snippets/cf-resolve-ips.conf;
    include snippets/ssl-params.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "sameorigin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Covers the moment of a deploy's pm2 restart, when nothing listens on the port yet. Only a refused connection
        # is retried: nginx does not retry a POST that may have been handled, so no command is run twice.
        proxy_connect_timeout 1s;
        proxy_next_upstream error;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 3s;
        # The API gives up on the Laravel app by itself after a few seconds
        proxy_read_timeout 15s;
    }

    ssl_certificate /etc/letsencrypt/live/beta.hammertime.cyou/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beta.hammertime.cyou/privkey.pem; # managed by Certbot
}

server {
    listen 80;
    server_name api.hammertime.cyou;
    return 301 https://$host$request_uri;
}
